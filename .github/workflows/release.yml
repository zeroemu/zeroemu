name: Release

# Builds, signs and publishes the command-line archive and the Mac app when a
# version tag is pushed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build, sign and publish
    runs-on: macos-15
    permissions:
      contents: write      # gh release create
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - name: Validate the release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::expected a release tag of the form vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Check that the tag matches Cargo.toml
        run: |
          version="${RELEASE_TAG#v}"
          crate=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "zeroemu") | .version')
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $RELEASE_TAG doesn't match the version in Cargo.toml ($crate)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NAME=zeroemu-$version-aarch64-apple-darwin" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked

      - name: Sign
        # Hypervisor.framework won't create a VM for a binary without this
        # entitlement. An ad-hoc signature can carry it.
        run: codesign -s - -f --entitlements entitlements.plist target/release/zeroemu

      - name: Check the signature and version
        run: |
          codesign --verify --strict --verbose=2 target/release/zeroemu
          codesign -d --entitlements - target/release/zeroemu > entitlements.txt 2>&1
          cat entitlements.txt
          if ! grep -q com.apple.security.hypervisor entitlements.txt; then
            echo "::error::the signed binary has no com.apple.security.hypervisor entitlement"
            exit 1
          fi
          test "$(target/release/zeroemu --version)" = "zeroemu $VERSION"

      - name: Package
        # NOTICE goes in, since Apache-2.0 (section 4(d)) asks that copies carry it.
        # COPYFILE_DISABLE and the tar flags keep macOS extended attributes and
        # AppleDouble (._*) files out of the archive. cp -X copies no attributes.
        run: |
          mkdir stage dist
          cp -X target/release/zeroemu LICENSE NOTICE README.md entitlements.plist stage/
          COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata \
            --uid 0 --gid 0 --uname root --gname wheel \
            -czf "dist/$NAME.tar.gz" -C stage zeroemu LICENSE NOTICE README.md entitlements.plist
          (cd dist && shasum -a 256 "$NAME.tar.gz" > SHA256SUMS)
          tar -tvzf "dist/$NAME.tar.gz"
          cat dist/SHA256SUMS

      - name: Check the package
        run: |
          test "$(tar -tzf "dist/$NAME.tar.gz" | LC_ALL=C sort | tr '\n' ' ')" = "LICENSE NOTICE README.md entitlements.plist zeroemu "
          mkdir unpacked
          tar -xzf "dist/$NAME.tar.gz" -C unpacked
          codesign --verify --strict unpacked/zeroemu
          codesign -d --entitlements - unpacked/zeroemu 2>&1 | grep -q com.apple.security.hypervisor
          (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Package and check the Mac app
        run: |
          scripts/build-app.sh
          app=${CARGO_TARGET_DIR:-target}/release/zeroemu.app
          if [ ! -f "$app/Contents/Resources/NOTICE" ]; then
            cp LICENSE NOTICE "$app/Contents/Resources/"
            codesign -s - -f --entitlements entitlements.plist "$app"
          fi
          ditto -c -k --norsrc --keepParent "$app" "dist/$NAME.app.zip"
          (cd dist && shasum -a 256 "$NAME.app.zip" > "$NAME.app.zip.sha256")

          ditto -x -k "dist/$NAME.app.zip" unpacked-app
          app=unpacked-app/zeroemu.app
          codesign --verify --strict "$app"
          codesign -d --entitlements - "$app/Contents/MacOS/zeroemu" 2>&1 | grep -q com.apple.security.hypervisor
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          test "$("$app/Contents/MacOS/zeroemu" --version)" = "zeroemu $VERSION"
          test -f "$app/Contents/Resources/LICENSE"
          test -f "$app/Contents/Resources/NOTICE"
          (cd dist && shasum -a 256 -c "$NAME.app.zip.sha256")

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.app.zip
            stage/zeroemu

      - name: Publish the release assets
        # New releases are pre-releases while zeroemu is a developer preview.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); then
            uploads=()
            add_missing_pair() {
              local package="$1" checksum="$2"
              if grep -Fxq -- "$package" <<< "$assets"; then
                if grep -Fxq -- "$checksum" <<< "$assets"; then return; fi
              elif ! grep -Fxq -- "$checksum" <<< "$assets"; then
                uploads+=("dist/$package" "dist/$checksum")
                return
              fi
              echo "::error::release $RELEASE_TAG has only one of $package and $checksum"
              return 1
            }
            add_missing_pair "$NAME.tar.gz" SHA256SUMS
            add_missing_pair "$NAME.app.zip" "$NAME.app.zip.sha256"
            if (( ${#uploads[@]} )); then gh release upload "$RELEASE_TAG" "${uploads[@]}"; fi
            exit
          fi

          sed -e "s|@REPO@|$GITHUB_REPOSITORY|g" -e "s|@TAG@|$RELEASE_TAG|g" -e "s|@VERSION@|$VERSION|g" \
            .github/release-notes.md > notes.md
          gh release create "$RELEASE_TAG" \
            --verify-tag --prerelease \
            --title "zeroemu $VERSION" \
            --notes-file notes.md --generate-notes \
            "dist/$NAME.tar.gz" dist/SHA256SUMS "dist/$NAME.app.zip" "dist/$NAME.app.zip.sha256"
